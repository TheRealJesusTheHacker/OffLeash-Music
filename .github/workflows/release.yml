name: OffLeash — Release

# Release route: the API credential used for day-to-day repo work cannot
# upload release assets (uploads.github.com rejects it), so the asset
# attach happens here, inside CI, with this workflow's GITHUB_TOKEN.
#
# Trigger: manual dispatch only, with an existing tag (dispatch-only
# since 2026-10-27 — tag pushes no longer trigger this workflow).
#
# The hunt APK is built exactly as android.yml builds it — same cached
# CI debug keystore (cache key offleash-debug-keystore-v2), same
# -PoffleashDebugKeystore signing path, same unit-test gate — and is
# attached to the GitHub release for the tag together with a
# SHA256SUMS.txt.
#
# Signer gate: the APK must carry the project's established G3 CI debug
# signer (SHA-256 below). If the keystore cache was evicted and a fresh
# key was generated, the digest differs and this workflow fails BEFORE
# any upload — an APK signed by a different key is never attached.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v0.6.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same stable hunt signing as android.yml: restore the shared CI
      # debug keystore before any Gradle step.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-debug/debug.keystore
          key: offleash-debug-keystore-v2

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare stable CI debug keystore
        run: |
          if [ ! -f ci-debug/debug.keystore ]; then
            mkdir -p ci-debug
            keytool -genkeypair -keystore ci-debug/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10957 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh CI debug keystore (cache was empty)."
          else
            echo "Restored the CI debug keystore from cache."
          fi
          keytool -list -v -keystore ci-debug/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA256:" || true

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run the unit tests (core + app, both flavors)
        run: ./gradlew :core:test :app:testStandardDebugUnitTest :app:testHuntDebugUnitTest -PoffleashDebugKeystore="$GITHUB_WORKSPACE/ci-debug/debug.keystore" --console=plain

      - name: Build the debug APKs (both flavors)
        run: ./gradlew assembleDebug -PoffleashDebugKeystore="$GITHUB_WORKSPACE/ci-debug/debug.keystore" --console=plain

      - name: Stage the hunt APK, verify the signer, write SHA256SUMS.txt
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EXPECTED_SIGNER_SHA256: "3176e075d152787d2f4d5224d26f42ca38a88563abcc3d4a12cb4a17081e84b4"
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NAME="OffLeash-Hunt-${VERSION}-window-hunt1.apk"
          mkdir -p release-assets
          SRC=$(ls app/build/outputs/apk/hunt/debug/*.apk | head -n 1)
          echo "Built hunt APK: $SRC"
          cp "$SRC" "release-assets/$NAME"
          CERTS=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "release-assets/$NAME")
          echo "$CERTS"
          DIGEST=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "Hunt APK signer SHA-256: $DIGEST"
          echo "Hunt APK signer SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DIGEST" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "Signer mismatch: got $DIGEST, expected $EXPECTED_SIGNER_SHA256 — refusing to attach an APK signed by a different key." >&2
            exit 1
          fi
          (cd release-assets && sha256sum "$NAME" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l release-assets

      - name: Attach the APK and SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "OffLeash Music $RELEASE_TAG" --notes "OffLeash Music hunt build, signed with the project's CI debug key (not a store release key). See the repository README and docs."
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
