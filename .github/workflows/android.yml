name: OffLeash — Android

# Phase 1 gate: the :core JVM suite (fixture-pinned parsers + resolver +
# queue), the :app unit tests, and the debug APK build. The debug APK is a
# personal-use build artifact — this workflow never creates a release.
#
# The live-smoke job replays the SPEC §1 recon probes (anonymous browse /
# search / iOS-context player / ranged stream GET) from the runner and
# reports the true result. It is deliberately NON-GATING: YouTube can
# change its unofficial API at any time, and a red smoke must be visible
# without masquerading as a code regression (or vice versa).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run the unit tests (core + app)
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain

      - name: Build the debug APK (personal-use artifact, not a release)
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offleash-phase1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  live-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Replay the anonymous youtubei probes (browse/search/player/stream)
        run: python3 scripts/live_smoke.py
