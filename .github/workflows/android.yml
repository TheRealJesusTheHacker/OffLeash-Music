name: OffLeash — Android

# Phase 1 gate: the :core JVM suite (fixture-pinned parsers + resolver +
# queue), the :app unit tests, and the debug APK build. The debug APK is a
# personal-use build artifact — this workflow never creates a release.
#
# The live-smoke job replays the SPEC §1 recon probes (anonymous browse /
# search / iOS-context player / ranged stream GET) from the runner and
# reports the true result. It is deliberately NON-GATING: YouTube can
# change its unofficial API at any time, and a red smoke must be visible
# without masquerading as a code regression (or vice versa).

on:
  push:
    branches: [main, hunt-playback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Stable hunt signing: restore the shared CI debug keystore before
      # any Gradle step. The keystore lives at ci-debug/debug.keystore
      # inside the workspace (never committed; see .gitignore); the
      # "Prepare stable CI debug keystore" step below generates it when
      # the cache provided none, and the post-job cache save persists it,
      # so later runs restore it and the hunt APK keeps one signer
      # identity across builds.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ci-debug/debug.keystore
          key: offleash-debug-keystore-v2

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare stable CI debug keystore
        run: |
          if [ ! -f ci-debug/debug.keystore ]; then
            mkdir -p ci-debug
            keytool -genkeypair -keystore ci-debug/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10957 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh CI debug keystore (cache was empty)."
          else
            echo "Restored the CI debug keystore from cache."
          fi
          keytool -list -v -keystore ci-debug/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA256:" || true

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run the unit tests (core + app, both flavors)
        run: ./gradlew :core:test :app:testStandardDebugUnitTest :app:testHuntDebugUnitTest -PoffleashDebugKeystore="$GITHUB_WORKSPACE/ci-debug/debug.keystore" --console=plain

      - name: Build the debug APKs (both flavors, personal-use artifacts, not a release)
        run: ./gradlew assembleDebug -PoffleashDebugKeystore="$GITHUB_WORKSPACE/ci-debug/debug.keystore" --console=plain

      - name: Record the hunt APK signer fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/hunt/debug/*.apk | head -n 1)
          echo "Hunt APK: $APK"
          CERTS=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          DIGEST=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')
          if [ -z "$DIGEST" ]; then
            echo "Could not extract the hunt signer digest" >&2
            exit 1
          fi
          echo "Hunt APK signer SHA-256: $DIGEST"
          echo "Hunt APK signer SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offleash-standard-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offleash-hunt-debug-apk
          path: app/build/outputs/apk/hunt/debug/*.apk
          if-no-files-found: error

  live-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Replay the anonymous youtubei probes (browse/search/player/stream)
        run: python3 scripts/live_smoke.py
