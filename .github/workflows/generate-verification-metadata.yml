name: Generate verification metadata (manual, supply-chain)

# REGENERATION PATH for gradle/verification-metadata.xml — NOT a CI gate.
#
# Fleet policy (owner, 2026-10-25): every dependency install must verify
# hashes against a committed lock and fail loudly on mismatch. For Gradle
# the lock is gradle/verification-metadata.xml (SHA-256 per artifact),
# generated from a known-good resolution of the CURRENT pinned versions:
#
#   1. Run this workflow manually (workflow_dispatch) on the branch whose
#      pinned versions you want to lock.
#   2. Download the `verification-metadata` artifact it uploads.
#   3. Commit that file as gradle/verification-metadata.xml, together with
#      the version change that made regeneration necessary.
#   4. A normal CI run then enforces it: any artifact whose SHA-256 does
#      not match the committed metadata fails the build.
#
# This workflow never runs automatically (no push / pull_request trigger)
# and its result gates nothing by itself — enforcement lives in the main
# "OffLeash — Android" workflow, which resolves the same configurations
# with the committed metadata in place.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Resolve (and download) the full dependency set — build plugins,
      # :core test, :app unit tests for BOTH flavors in debug AND release,
      # and assemble (debug + release, both flavors) — while Gradle writes
      # SHA-256 verification metadata for every artifact it resolves.
      - name: Generate verification metadata from the full resolution
        run: >
          ./gradlew --write-verification-metadata sha256
          :core:test
          :app:testStandardDebugUnitTest :app:testHuntDebugUnitTest
          :app:testStandardReleaseUnitTest :app:testHuntReleaseUnitTest
          assemble
          --console=plain

      - name: Summarize the generated metadata
        run: |
          test -f gradle/verification-metadata.xml
          echo "Components: $(grep -c '<component ' gradle/verification-metadata.xml)"
          echo "Artifacts:  $(grep -c '<artifact ' gradle/verification-metadata.xml)"
          ls -l gradle/verification-metadata.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
